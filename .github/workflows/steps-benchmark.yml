name: "Cal.diy — Step Overhead Benchmark"

on:
  push:
    branches:
      - applications/calcoms

env:
  DATABASE_URL: "postgresql://postgres@localhost:5450/cal-saml"
  DATABASE_DIRECT_URL: "postgresql://postgres@localhost:5450/cal-saml"

jobs:
  all-steps:
    name: "All Steps in One Job"
    runs-on: self-hosted
    defaults:
      run:
        # Use Windows PowerShell 5.1 explicitly (avoids WSL bash collision in System32).
        shell: powershell
        working-directory: cal.diy
    steps:
      - name: "Step 01 — Cleanup Previous Runs"
        working-directory: .
        run: |
          # Native stderr from docker would trip the runner's injected $ErrorActionPreference='stop'.
          $ErrorActionPreference = 'Continue'
          $ids = docker ps -q
          if ($ids) { docker stop $ids | Out-Null }
          $ids = docker ps -aq
          if ($ids) { docker rm $ids | Out-Null }
          $ids = docker images -q
          if ($ids) { docker rmi -f $ids | Out-Null }
          docker system prune -af --volumes | Out-Null
          $global:LASTEXITCODE = 0

      - name: "Step 02 — Checkout"
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: "Step 02b — Patch cal.diy ui build-icons script"
        # The submodule's build-icons.mjs invokes biome on apps/web/public/icons/sprite.svg,
        # which biome.json excludes. Biome 2 exits 1 in that case. Add --no-errors-on-unmatched.
        run: |
          $f = 'packages/ui/scripts/build-icons.mjs'
          if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          $c = Get-Content $f -Raw
          if ($c.Contains('--no-errors-on-unmatched')) {
            Write-Host "$f already patched"
          } else {
            $old = 'format --write ${filepath}'
            $new = 'format --write --no-errors-on-unmatched ${filepath}'
            if (-not $c.Contains($old)) { Write-Error "patch anchor not found in $f"; exit 1 }
            $c = $c.Replace($old, $new)
            Set-Content -Path $f -Value $c -NoNewline -Encoding UTF8
            Write-Host "Patched $f"
          }

      - name: "Step 03 — Node Setup"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Step 04 — Corepack Enable"
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack install

      - name: Step 04 - Clean dependencies
        run: |
          $ErrorActionPreference = 'Continue'
          $targets = @(
            'node_modules',
            '.yarn/cache',
            '.yarn/install-state.gz',
            '.yarn/unplugged',
            '.yarn/build-state.yml',
            '.next',
            '.turbo'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              Write-Host "Removing $t"
              Remove-Item -Recurse -Force $t -ErrorAction SilentlyContinue
            }
          }
          # Also wipe nested workspace node_modules / .next / .turbo
          Get-ChildItem -Path . -Directory -Recurse -Force `
            -Include node_modules, .next, .turbo `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' } |
            ForEach-Object {
              Write-Host "Removing $($_.FullName)"
              Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue
            }
          $global:LASTEXITCODE = 0

      - name: "Step 05 — Yarn Install"
        run: yarn install

      - name: "Step 06 — Environment Setup"
        run: |
          Copy-Item .env.example .env -Force
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $b32 = New-Object byte[] 32; $rng.GetBytes($b32); $NEXTAUTH_SECRET = [Convert]::ToBase64String($b32)
          $b24 = New-Object byte[] 24; $rng.GetBytes($b24); $CALENDSO_ENCRYPTION_KEY = [Convert]::ToBase64String($b24)
          (Get-Content .env) | ForEach-Object {
            if     ($_ -match '^NEXTAUTH_SECRET=')         { "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" }
            elseif ($_ -match '^CALENDSO_ENCRYPTION_KEY=') { "CALENDSO_ENCRYPTION_KEY=$CALENDSO_ENCRYPTION_KEY" }
            else                                           { $_ }
          } | Set-Content .env -Encoding UTF8
          Add-Content .env "DATABASE_URL=$env:DATABASE_URL"
          Add-Content .env "DATABASE_DIRECT_URL=$env:DATABASE_DIRECT_URL"
          # Windows git checkout materializes the repo's packages/prisma/.env symlink as a text file
          # containing "../../.env". Replace it with a real copy so docker compose can read it.
          Copy-Item .env packages/prisma/.env -Force

      - name: "Step 07 — Lint"
        run: yarn lint

      - name: "Step 08 — Type Check"
        # Bypass turbo's strict env filtering so NODE_OPTIONS reaches tsc child processes.
        run: yarn turbo run type-check --env-mode=loose
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"


      - name: "Step 10 — Prisma Validate"
        run: yarn workspace @calcom/prisma prisma validate

      - name: "Step 11 — Start Database"
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose -f packages/prisma/docker-compose.yml up -d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 5

      - name: "Step 12 — Build"
        # Bypass turbo's strict env filtering so NODE_OPTIONS reaches the Next.js build worker.
        # Exclude @calcom/base demo app (upstream dayjs module-augmentation type error, not part of deliverable).
        run: yarn turbo run build --env-mode=loose --filter=!@calcom/base
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: "Step 13 — Stop Database"
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose -f packages/prisma/docker-compose.yml down
          $global:LASTEXITCODE = 0

      - name: "Step 14 — Docker Build"
        run: |
                Set-Location "$env:GITHUB_WORKSPACE\cal.diy"
                $ErrorActionPreference = 'Continue'
                $env:PATH = "C:\Program Files\Docker\Docker\resources\bin;$env:PATH"
                Get-ChildItem -Path . -Recurse -Include *.sh -File |
                  Where-Object { $_.FullName -notmatch '\\node_modules\\' } |
                  ForEach-Object {
                    $bytes = [IO.File]::ReadAllBytes($_.FullName)
                    if ($bytes -contains 13) {
                      $text = [Text.Encoding]::UTF8.GetString($bytes) -replace "`r`n", "`n" -replace "`r", "`n"
                      [IO.File]::WriteAllBytes($_.FullName, [Text.Encoding]::UTF8.GetBytes($text))
                      Write-Host "Normalized LF: $($_.FullName)"
                    }
                  }
                docker build -t cal-diy:bench -f Dockerfile .
                $buildExit = $LASTEXITCODE
                if ($buildExit -eq 0) { docker rmi -f cal-diy:bench | Out-Null }
                $global:LASTEXITCODE = 0
                if ($buildExit -ne 0) { exit $buildExit }

