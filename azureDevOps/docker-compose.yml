version: '3.8'

services:
  azure-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azure_devops_agent
    restart: always
    environment:
      - AZP_URL=${AZP_URL}
      - AZP_TOKEN=${AZP_TOKEN}
      - AZP_POOL=${AZP_POOL}
      - AZP_AGENT_NAME=${AZP_AGENT_NAME:-azure-agent}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/home/azureagent/_work
      - ..:/workspace:ro
    privileged: true
    ports:
      - "9105:8080"  # cAdvisor port
      - "5672:5672"  # Expose RabbitMQ port
      - "15672:15672"  # Expose RabbitMQ management UI
      - "8761:8761" # Expose Eureka server port
      - "8000:8000" # Product Service instances
      - "8081:8081" # Product Service instances
      - "8082:8082" # Offer Service
      - "4200:3000" # Microservice UI (Angular)
      - "9102:8080"  # Expose cAdvisor on a unique port
    networks:
      - monitoring

volumes:
  agent-data:

networks:
  monitoring: