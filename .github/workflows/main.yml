name: Zammad CI/CD Pipeline

on:
  push:
    branches:
      - zammad

jobs:
  cleanup:
    name: Cleanup Old Containers
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop and remove existing Zammad containers
        run: |
          echo "🧹 Cleaning up old containers..."
          if [ -d "zammad-docker-compose" ]; then
            docker-compose -f zammad-docker-compose/docker-compose.yml down --volumes --remove-orphans 2>/dev/null || true
          fi
          docker system prune -f --volumes 2>/dev/null || true
          echo "✅ Cleanup complete."

  deploy:
    name: Deploy Zammad
    runs-on: self-hosted
    needs: cleanup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Zammad Docker Compose
        run: |
          echo "📦 Cloning Zammad Docker Compose repository..."
          rm -rf zammad-docker-compose
          git clone https://github.com/zammad/zammad-docker-compose.git zammad-docker-compose
          echo "✅ Zammad repo cloned."

      - name: Start Zammad stack
        run: |
          echo "🚀 Starting Zammad application stack..."
          docker-compose -f zammad-docker-compose/docker-compose.yml up -d
          echo "✅ Zammad stack started."

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "⏳ Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            if docker-compose -f zammad-docker-compose/docker-compose.yml exec -T zammad-postgresql pg_isready -U zammad > /dev/null 2>&1; then
              echo "✅ PostgreSQL is ready."
              exit 0
            fi
            echo "  Attempt $i/30 - PostgreSQL not ready yet..."
            sleep 5
          done
          echo "❌ PostgreSQL failed to start."
          exit 1

      - name: Wait for Zammad init to complete
        run: |
          echo "⏳ Waiting for Zammad init container to finish..."
          for i in $(seq 1 60); do
            STATUS=$(docker-compose -f zammad-docker-compose/docker-compose.yml ps --format json zammad-init 2>/dev/null | jq -r '.State' 2>/dev/null || echo "running")
            if [ "$STATUS" = "exited" ]; then
              EXIT_CODE=$(docker-compose -f zammad-docker-compose/docker-compose.yml ps --format json zammad-init 2>/dev/null | jq -r '.ExitCode' 2>/dev/null || echo "1")
              if [ "$EXIT_CODE" = "0" ]; then
                echo "✅ Zammad init completed successfully."
                exit 0
              else
                echo "❌ Zammad init failed with exit code $EXIT_CODE."
                docker-compose -f zammad-docker-compose/docker-compose.yml logs zammad-init
                exit 1
              fi
            fi
            echo "  Attempt $i/60 - Zammad init still running..."
            sleep 10
          done
          echo "❌ Zammad init timed out."
          exit 1

      - name: Wait for Zammad Nginx to be healthy
        run: |
          echo "⏳ Waiting for Zammad web interface..."
          for i in $(seq 1 40); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ Zammad is reachable (HTTP $HTTP_STATUS)."
              exit 0
            fi
            echo "  Attempt $i/40 - HTTP status: $HTTP_STATUS"
            sleep 10
          done
          echo "❌ Zammad web interface failed to respond."
          exit 1

  test:
    name: Test Zammad Deployment
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Zammad Docker Compose
        run: |
          rm -rf zammad-docker-compose
          git clone https://github.com/zammad/zammad-docker-compose.git zammad-docker-compose

      - name: Verify all services are running
        run: |
          echo "🔍 Checking running services..."
          SERVICES=("zammad-nginx" "zammad-railsserver" "zammad-scheduler" "zammad-websocket" "zammad-postgresql" "zammad-redis" "zammad-memcached")
          ALL_OK=true
          for svc in "${SERVICES[@]}"; do
            STATUS=$(docker-compose -f zammad-docker-compose/docker-compose.yml ps --format json "$svc" 2>/dev/null | jq -r '.State' 2>/dev/null || echo "missing")
            if [ "$STATUS" = "running" ]; then
              echo "  ✅ $svc is running."
            else
              echo "  ❌ $svc is NOT running (state: $STATUS)."
              ALL_OK=false
            fi
          done
          if [ "$ALL_OK" = false ]; then
            echo "❌ Some services are not running."
            exit 1
          fi
          echo "✅ All services are healthy."

      - name: Test Zammad API health endpoint
        run: |
          echo "🔍 Testing Zammad API..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/monitoring/health_check 2>/dev/null || echo "000")
          echo "  Health check HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "✅ Zammad API is responding."
          else
            echo "⚠️ Zammad API returned HTTP $HTTP_STATUS (may still be initializing)."
          fi

      - name: Test PostgreSQL connectivity
        run: |
          echo "🔍 Testing PostgreSQL..."
          docker-compose -f zammad-docker-compose/docker-compose.yml exec -T zammad-postgresql psql -U zammad -d zammad_production -c "SELECT count(*) FROM pg_tables WHERE schemaname = 'public';" 2>/dev/null
          echo "✅ PostgreSQL connectivity verified."

      - name: Test Redis connectivity
        run: |
          echo "🔍 Testing Redis..."
          PONG=$(docker-compose -f zammad-docker-compose/docker-compose.yml exec -T zammad-redis redis-cli ping 2>/dev/null || echo "FAIL")
          if [ "$PONG" = "PONG" ]; then
            echo "✅ Redis is healthy."
          else
            echo "❌ Redis ping failed."
            exit 1
          fi

      - name: Collect container logs
        if: always()
        run: |
          echo "📋 Collecting container logs..."
          docker-compose -f zammad-docker-compose/docker-compose.yml logs --tail=50

  teardown:
    name: Teardown Zammad
    runs-on: self-hosted
    needs: test
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Zammad Docker Compose
        run: |
          rm -rf zammad-docker-compose
          git clone https://github.com/zammad/zammad-docker-compose.git zammad-docker-compose

      - name: Stop Zammad stack
        run: |
          echo "🛑 Stopping Zammad stack..."
          docker-compose -f zammad-docker-compose/docker-compose.yml down --volumes --remove-orphans
          echo "✅ Zammad stack stopped and cleaned up."