name: Microservices CI/CD Pipeline

on:
  push:
    branches:
      - applications/complete-microservices
      
jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      microservice-ui: ${{ steps.changes.outputs.microservice-ui }}
      service-registry: ${{ steps.changes.outputs.service-registry }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      product-service: ${{ steps.changes.outputs.product-service }}
      offer-service: ${{ steps.changes.outputs.offer-service }}
    steps:

      - name: Fix workspace permissions before checkout
        run: |
          echo "Fixing workspace permissions..."
          sudo chown -R runner:runner $GITHUB_WORKSPACE 2>/dev/null || true
          sudo chmod -R u+w $GITHUB_WORKSPACE 2>/dev/null || true
          # Force remove target directories if they exist
          sudo rm -rf $GITHUB_WORKSPACE/complete-microservice-application/*/target || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better change detection
          clean: false

      - name: Detect changes
        id: changes
        run: |
          echo "Detecting changes in microservices..."
          
          # Show what files changed for debugging
          echo "Changed files:"
          git diff --name-only HEAD~1 HEAD || git diff --name-only HEAD
          
          # Check for changes in each microservice directory (more flexible patterns)
          if git diff --name-only HEAD~1 HEAD | grep -E "(microservice-ui|complete-microservice-application/microservice-ui)" || \
             git diff --name-only HEAD | grep -E "(microservice-ui|complete-microservice-application/microservice-ui)"; then
            echo "microservice-ui=true" >> $GITHUB_OUTPUT
            echo "✅ Detected changes in microservice-ui"
          else
            echo "microservice-ui=false" >> $GITHUB_OUTPUT
            echo "❌ No changes in microservice-ui"
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -E "(service-registry|complete-microservice-application/service-registry)" || \
             git diff --name-only HEAD | grep -E "(service-registry|complete-microservice-application/service-registry)"; then
            echo "service-registry=true" >> $GITHUB_OUTPUT
            echo "✅ Detected changes in service-registry"
          else
            echo "service-registry=false" >> $GITHUB_OUTPUT
            echo "❌ No changes in service-registry"
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -E "(api-gateway|complete-microservice-application/api-gateway)" || \
             git diff --name-only HEAD | grep -E "(api-gateway|complete-microservice-application/api-gateway)"; then
            echo "api-gateway=true" >> $GITHUB_OUTPUT
            echo "✅ Detected changes in api-gateway"
          else
            echo "api-gateway=false" >> $GITHUB_OUTPUT
            echo "❌ No changes in api-gateway"
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -E "(product-service|complete-microservice-application/product-service)" || \
             git diff --name-only HEAD | grep -E "(product-service|complete-microservice-application/product-service)"; then
            echo "product-service=true" >> $GITHUB_OUTPUT
            echo "✅ Detected changes in product-service"
          else
            echo "product-service=false" >> $GITHUB_OUTPUT
            echo "❌ No changes in product-service"
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -E "(offer-service|complete-microservice-application/offer-service)" || \
             git diff --name-only HEAD | grep -E "(offer-service|complete-microservice-application/offer-service)"; then
            echo "offer-service=true" >> $GITHUB_OUTPUT
            echo "✅ Detected changes in offer-service"
          else
            echo "offer-service=false" >> $GITHUB_OUTPUT
            echo "❌ No changes in offer-service"
          fi
          
          # Show final outputs for debugging
          echo "=== FINAL OUTPUTS ==="
          echo "microservice-ui: $(grep microservice-ui <<< '$GITHUB_OUTPUT' | cut -d= -f2)"
          echo "service-registry: $(grep service-registry <<< '$GITHUB_OUTPUT' | cut -d= -f2)"
          echo "api-gateway: $(grep api-gateway <<< '$GITHUB_OUTPUT' | cut -d= -f2)"
          echo "product-service: $(grep product-service <<< '$GITHUB_OUTPUT' | cut -d= -f2)"
          echo "offer-service: $(grep offer-service <<< '$GITHUB_OUTPUT' | cut -d= -f2)"

  # Add a debug job to see what changes were detected
  debug-changes:
    runs-on: self-hosted
    needs: detect-changes
    steps:
      - name: Show detected changes
        run: |
          echo "=== DETECTED CHANGES DEBUG ==="
          echo "microservice-ui: ${{ needs.detect-changes.outputs.microservice-ui }}"
          echo "service-registry: ${{ needs.detect-changes.outputs.service-registry }}"
          echo "api-gateway: ${{ needs.detect-changes.outputs.api-gateway }}"
          echo "product-service: ${{ needs.detect-changes.outputs.product-service }}"
          echo "offer-service: ${{ needs.detect-changes.outputs.offer-service }}"

  setup-infrastructure:
    runs-on: self-hosted
    needs: detect-changes
    steps:
      - name: Fix workspace permissions
        run: |
          echo "Fixing workspace permissions..."
          sudo chown -R runner:runner $GITHUB_WORKSPACE 2>/dev/null || true
          sudo chmod -R u+w $GITHUB_WORKSPACE 2>/dev/null || true

      - name: Clean workspace
        run: |
          echo "Cleaning workspace with proper permissions..."
          sudo rm -rf $GITHUB_WORKSPACE/complete-microservice-application/*/target || true
          sudo chown -R runner:runner $GITHUB_WORKSPACE || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup RabbitMQ
        run: |
          sudo bash complete-microservice-application/install-rabbitmq-ubuntu.sh

  build-service-registry:
    runs-on: self-hosted
    needs: [detect-changes, setup-infrastructure]
    if: needs.detect-changes.outputs.service-registry == 'true'
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning workspace with proper permissions..."
          sudo rm -rf $GITHUB_WORKSPACE/complete-microservice-application/*/target || true
          sudo chown -R runner:runner $GITHUB_WORKSPACE || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build and restart service-registry
        run: |

          cd complete-microservice-application/service-registry
          
          sudo pkill -f "service-registry" || true
          sleep 5
          
          sudo mvn clean install -DskipTests
          
          nohup sudo mvn spring-boot:run -Dspring-boot.run.jvmArguments="--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED" > /tmp/service-registry.log 2>&1 &
          
          for i in {1..180}; do
            if curl -s http://localhost:8761/actuator/health > /dev/null 2>&1; then
              break
            fi
            if [ $i -eq 60 ]; then
              cat /tmp/service-registry.log
              exit 1
            fi
            sleep 2
          done

  build-api-gateway:
    runs-on: self-hosted
    needs: build-service-registry
    if: needs.detect-changes.outputs.api-gateway == 'true' || needs.detect-changes.outputs.service-registry == 'true'
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning workspace with proper permissions..."
          sudo rm -rf $GITHUB_WORKSPACE/complete-microservice-application/*/target || true
          sudo chown -R runner:runner $GITHUB_WORKSPACE || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Wait for service registry if needed
        if: needs.detect-changes.outputs.service-registry == 'true'
        run: |
          echo "Waiting for service registry to be ready..."
          sleep 45  # Wait for service registry to fully start

      - name: Build and restart api-gateway
        run: |

          cd complete-microservice-application/api-gateway
          
          sudo pkill -f "api-gateway" || true
          sleep 5
          
          echo "Building api-gateway with Maven..."
          sudo mvn clean install -DskipTests

          nohup sudo mvn spring-boot:run -Dspring-boot.run.jvmArguments="--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED" &
          
          for i in {1..90}; do
            if curl -s http://localhost:8000/actuator/health > /dev/null 2>&1; then
              echo "✅ API Gateway is ready after $((i*2)) seconds!"
              break
            fi
            if [ $i -eq 90 ]; then
              echo "❌ API Gateway failed to start within 3 minutes"
              echo "=== Last 50 lines of api-gateway.log ==="
              tail -50 /tmp/api-gateway.log
              exit 1
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "Still waiting... ($((i*2))/180 seconds)"
            fi
            sleep 2
          done
          
          sleep 10

  build-product-service:
    runs-on: self-hosted
    needs: build-api-gateway
    if: needs.detect-changes.outputs.product-service == 'true' || needs.detect-changes.outputs.service-registry == 'true'
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning workspace with proper permissions..."
          sudo rm -rf $GITHUB_WORKSPACE/complete-microservice-application/*/target || true
          sudo chown -R runner:runner $GITHUB_WORKSPACE || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Wait for service registry if needed
        if: needs.detect-changes.outputs.service-registry == 'true'
        run: |
          echo "Waiting for service registry to be ready..."
          sleep 45  # Wait for service registry to fully start

      - name: Build and restart product-service
        run: |
          
          cd complete-microservice-application/product-service
          
          sudo pkill -f "product-service" || true
          sleep 5
          
          sudo mvn clean install -DskipTests
          
          cd target
          nohup sudo java $JAVA_OPTS -jar product-service-*.jar --server.port=8081 &

          nohup sudo java $JAVA_OPTS -jar product-service-*.jar --server.port=8180 &

          # Check instance on port 8081
          for i in {1..90}; do
            if curl -s http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "✅ Product Service (8081) is ready after $((i*2)) seconds!"
              break
            fi
            if [ $i -eq 90 ]; then
              echo "❌ Product Service (8081) failed to start"
              echo "=== Last 50 lines of product-service-8081.log ==="
              tail -50 /tmp/product-service-8081.log
              exit 1
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "Still waiting for 8081... ($((i*2))/180 seconds)"
            fi
            sleep 2
          done
          
          # Check instance on port 8180
          for i in {1..90}; do
            if curl -s http://localhost:8180/actuator/health > /dev/null 2>&1; then
              echo "✅ Product Service (8180) is ready after $((i*2)) seconds!"
              break
            fi
            if [ $i -eq 90 ]; then
              echo "❌ Product Service (8180) failed to start"
              echo "=== Last 50 lines of product-service-8180.log ==="
              tail -50 /tmp/product-service-8180.log
              exit 1
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "Still waiting for 8180... ($((i*2))/180 seconds)"
            fi
            sleep 2
          done

          sleep 10
        
  build-offer-service:
    runs-on: self-hosted
    needs: build-product-service
    if: needs.detect-changes.outputs.offer-service == 'true' || needs.detect-changes.outputs.service-registry == 'true'
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning workspace with proper permissions..."
          sudo rm -rf $GITHUB_WORKSPACE/complete-microservice-application/*/target || true
          sudo chown -R runner:runner $GITHUB_WORKSPACE || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Wait for service registry if needed
        if: needs.detect-changes.outputs.service-registry == 'true'
        run: |
          echo "Waiting for service registry to be ready..."
          sleep 45  # Wait for service registry to fully start

      - name: Build and restart offer-service
        run: |

          cd complete-microservice-application/offer-service
          
          sudo pkill -f "offer-service" || true
          sleep 5

          sudo mvn clean install -DskipTests

          nohup sudo mvn spring-boot:run -Dspring-boot.run.arguments="--server.port=8082" &

          for i in {1..90}; do
            if curl -s http://localhost:8082/actuator/health > /dev/null 2>&1; then
              echo "✅ Offer Service is ready after $((i*2)) seconds!"
              break
            fi
            if [ $i -eq 90 ]; then
              echo "❌ Offer Service failed to start within 3 minutes"
              echo "=== Last 50 lines of offer-service.log ==="
              tail -50 /tmp/offer-service.log
              exit 1
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "Still waiting... ($((i*2))/180 seconds)"
            fi
            sleep 2
          done

          sleep 30
          
  build-microservice-ui:
    runs-on: self-hosted
    needs: build-offer-service
    if: needs.detect-changes.outputs.microservice-ui == 'true' || needs.detect-changes.outputs.api-gateway == 'true'
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning workspace with proper permissions..."
          sudo rm -rf $GITHUB_WORKSPACE/complete-microservice-application/*/target || true
          sudo chown -R runner:runner $GITHUB_WORKSPACE || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12'

      - name: Build and restart microservice-ui
        run: |

          cd complete-microservice-application/microservice-ui
          
          sudo pkill -f "ng serve" || true
          sleep 5
          
          sudo npm install
          
          sudo npm install -g @angular/cli@8.3.25

          nohup sudo npx ng serve --host 0.0.0.0 --port 3000 --disable-host-check --poll=2000 --verbose &

          sleep 10
          
  health-check:
    runs-on: self-hosted
    needs: build-microservice-ui
    if: always()
    steps:
      - name: Health check services
        run: |
          echo "=== HEALTH CHECK ==="
          echo ""
          
          # Check RabbitMQ
          echo "Checking RabbitMQ..."
          if curl -f http://localhost:15672 > /dev/null 2>&1; then
            echo "✅ RabbitMQ Management Console is healthy at http://localhost:15672"
          else
            echo "❌ RabbitMQ is not responding"
          fi
          echo ""
          
          # Check service registry
          echo "Checking Service Registry..."
          if curl -f http://localhost:8761 > /dev/null 2>&1; then
            echo "✅ Service Registry is healthy at http://localhost:8761"
          else
            echo "❌ Service Registry is not responding"
          fi
          echo ""
          
          # Check API Gateway
          echo "Checking API Gateway..."
          if curl -f http://localhost:8000/actuator/health > /dev/null 2>&1; then
            echo "✅ API Gateway is healthy at http://localhost:8000"
          else
            echo "❌ API Gateway is not responding"
          fi
          echo ""
          
          # Check Product Service instances
          echo "Checking Product Service instances..."
          if curl -f http://localhost:8081/actuator/health > /dev/null 2>&1; then
            echo "✅ Product Service (8081) is healthy"
          else
            echo "❌ Product Service (8081) is not responding"
          fi
          
          if curl -f http://localhost:8180/actuator/health > /dev/null 2>&1; then
            echo "✅ Product Service (8180) is healthy"  
          else
            echo "❌ Product Service (8180) is not responding"
          fi
          echo ""
          
          # Check Offer Service
          echo "Checking Offer Service..."
          if curl -f http://localhost:8082/actuator/health > /dev/null 2>&1; then
            echo "✅ Offer Service is healthy at http://localhost:8082"
          else
            echo "❌ Offer Service is not responding"
          fi
          echo ""
          
          # Check Microservice UI
          echo "Checking Microservice UI..."
          if curl -f http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Microservice UI is healthy at http://localhost:3000/store"
          else
            echo "❌ Microservice UI is not responding"
          fi
          echo ""
          echo "=== HEALTH CHECK COMPLETE ==="

  deployment-status:
    runs-on: self-hosted
    needs: health-check
    if: always()
    steps:
      - name: Show deployment summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "           MICROSERVICES DEPLOYMENT SUMMARY"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "🚀 Deployment completed!"
          echo "" 
          echo "📊 Service Endpoints:"
          echo "  ┌─────────────────────────────────────────────────────────────"
          echo "  │ Service Registry (Eureka):  http://localhost:8761"
          echo "  │ API Gateway (Zuul):          http://localhost:8000"
          echo "  │ Product Service (Instance 1): http://localhost:8081"
          echo "  │ Product Service (Instance 2): http://localhost:8180"
          echo "  │ Offer Service:               http://localhost:8082"
          echo "  │ Microservice UI (Angular):   http://localhost:3000/store"
          echo "  │ RabbitMQ Management:         http://localhost:15672"
          echo "  └─────────────────────────────────────────────────────────────"
          echo ""
          echo "🔐 Database Credentials:"
          echo "  ┌─────────────────────────────────────────────────────────────"
          echo "  │ Product H2 Console:  http://localhost:8081/h2"
          echo "  │   JDBC URL:  jdbc:h2:~/product"
          echo "  │   Username:  root"
          echo "  │   Password:  root"
          echo "  │"
          echo "  │ Offer H2 Console:    http://localhost:8082/h2"
          echo "  │   JDBC URL:  jdbc:h2:~/offer"
          echo "  │   Username:  root"  
          echo "  │   Password:  root"
          echo "  │"
          echo "  │ RabbitMQ Credentials:"
          echo "  │   Username:  guest"
          echo "  │   Password:  guest"
          echo "  └─────────────────────────────────────────────────────────────"
          echo ""
          echo "📋 API Endpoints (via API Gateway):"
          echo "  ┌─────────────────────────────────────────────────────────────"
          echo "  │ GET    http://localhost:8000/product-service/products"
          echo "  │ POST   http://localhost:8000/product-service/products"
          echo "  │ PUT    http://localhost:8000/product-service/products/addPrice"
          echo "  │ POST   http://localhost:8000/offer-service/offer"
          echo "  └─────────────────────────────────────────────────────────────"
          echo ""
          echo "🔄 Load Balancing: API Gateway handles round-robin distribution"
          echo "   between Product Service instances (8081, 8180)"
          echo ""
          echo "📨 Event-Driven: RabbitMQ manages async communication between"
          echo "   Offer Service and Product Service"
          echo ""
          echo "════════════════════════════════════════════════════════════════"