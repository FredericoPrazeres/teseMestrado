trigger:
  branches:
    include:
      - applications/directus

pool:
  name: TeseMestradoPool

jobs:
  - job: RunPipeline
    displayName: 'Checkout repository'
    steps:
      - checkout: self
        clean: false
        submodules: true
        displayName: 'Checkout repository'

      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Setup Node.js'

      - script: |
          npm install -g pnpm@10 --force
        displayName: 'Install pnpm'

      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Setup Node.js'
      - script: |
          cd directus && pnpm install --frozen-lockfile
        displayName: 'Install dependencies'

      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Setup Node.js'
      - script: |
          cd directus && pnpm lint
        displayName: 'Lint'

      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Setup Node.js'
      - script: |
          cd directus && pnpm build
        displayName: 'Build'
