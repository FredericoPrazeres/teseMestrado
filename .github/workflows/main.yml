name: Directus CI Pipeline

on:
  push:
    branches:
      - applications/directuss

jobs:

  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clean dependencies
        run: rm -rf node_modules

      - name: Install dependencies
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 22
          echo "$(dirname $(which node))" >> $GITHUB_PATH
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build