name: Outline Build Pipeline

on:
  push:
    branches:
      - applications/outline

jobs:
  checkout:
    name: Checkout code
    runs-on: self-hosted
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

  generate-env:
    name: Generate .env file
    runs-on: self-hosted
    needs: checkout
    defaults:
      run:
        working-directory: outline
    steps:
      - name: Generate .env file
        run: |
          echo "=== Generating .env file ==="
          cat > .env << 'ENVEOF'
          NODE_ENV=development
          URL=http://localhost:3000
          PORT=3000
          WEB_CONCURRENCY=1
          DEFAULT_LANGUAGE=en_US
          DATABASE_URL=postgres://outline_user:outline_pass@127.0.0.1:5432/outline
          PGSSLMODE=disable
          REDIS_URL=redis://127.0.0.1:6379
          FILE_STORAGE=local
          FILE_STORAGE_LOCAL_ROOT_DIR=/tmp/outline-data
          FILE_STORAGE_UPLOAD_MAX_SIZE=262144000
          FORCE_HTTPS=false
          RATE_LIMITER_ENABLED=false
          ENABLE_UPDATES=false
          DEBUG=http
          LOG_LEVEL=debug
          SMTP_FROM_EMAIL=hello@example.com
          ENVEOF
          SECRET_KEY=$(openssl rand -hex 32)
          UTILS_SECRET=$(openssl rand -hex 32)
          echo "SECRET_KEY=$SECRET_KEY" >> .env
          echo "UTILS_SECRET=$UTILS_SECRET" >> .env
          echo "✅ .env file created"

  verify-dependencies:
    name: Verify dependencies
    runs-on: self-hosted
    needs: checkout
    steps:
      - name: Verify dependencies
        run: |
          echo "=== Verifying system dependencies ==="
          node --version
          yarn --version
          pg_isready || echo "WARNING: PostgreSQL is not running"
          redis-cli ping || echo "WARNING: Redis is not running"

  start-services:
    name: Start services
    runs-on: self-hosted
    needs: verify-dependencies
    steps:
      - name: Start services
        run: |
          echo "=== Starting PostgreSQL and Redis ==="
          sudo systemctl start postgresql redis-server
          sleep 3
          pg_isready
          redis-cli ping

  install-dependencies:
    name: Install Node.js dependencies
    runs-on: self-hosted
    needs:
      - generate-env
      - start-services
    defaults:
      run:
        working-directory: outline
    steps:
      - name: Install Node.js dependencies
        run: |
          echo "=== Cleaning previous build ==="
          yarn clean || true
          rm -rf node_modules/.cache
          echo "=== Installing dependencies ==="
          NODE_ENV=development yarn install --immutable

  build-outline:
    name: Build Outline
    runs-on: self-hosted
    needs: install-dependencies
    defaults:
      run:
        working-directory: outline
    steps:
      - name: Build Outline
        run: |
          echo "=== Building Outline ==="
          NODE_ENV=production yarn build

  reset-database:
    name: Reset database
    runs-on: self-hosted
    needs: start-services
    defaults:
      run:
        working-directory: outline
    steps:
      - name: Reset database
        run: |
          echo "=== Resetting database ==="
          yarn db:reset || echo "Database reset via yarn failed, trying manually..."
          dropdb --if-exists outline && createdb -O outline_user outline && echo "✅ Database recreated" || echo "Database may not have existed"

  run-migrations:
    name: Run database migrations
    runs-on: self-hosted
    needs:
      - build-outline
      - reset-database
    defaults:
      run:
        working-directory: outline
    steps:
      - name: Run database migrations
        run: |
          echo "=== Running database migrations ==="
          yarn db:create --env=production-ssl-disabled || echo "Database already exists"
          yarn start &
          SERVER_PID=$!
          echo "Waiting for server to start and run migrations..."
          sleep 15
          kill $SERVER_PID 2>/dev/null || true
          echo "Migrations complete"

  verify-build:
    name: Verify build output
    runs-on: self-hosted
    needs: run-migrations
    defaults:
      run:
        working-directory: outline
    steps:
      - name: Verify build output
        run: |
          echo "=== Verifying build ==="
          test -f build/server/index.js && echo "✅ Server build OK" || (echo "❌ Server build missing" && exit 1)
          test -d build/app && echo "✅ Client build OK" || (echo "❌ Client build missing" && exit 1)
          echo "🎉 Outline build completed successfully!"

  start-outline:
    name: Start Outline
    runs-on: self-hosted
    needs: verify-build
    defaults:
      run:
        working-directory: outline
    steps:
      - name: Start Outline
        run: |
          echo "=== Starting Outline ==="
          yarn start &
          SERVER_PID=$!
          echo "Outline started with PID $SERVER_PID"
          echo "Waiting for server to be ready..."
          sleep 10
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200\|302" && echo "✅ Outline is running at http://localhost:3000" || echo "⚠️ Server started but may still be initializing"
