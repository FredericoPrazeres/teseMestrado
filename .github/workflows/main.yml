name: Directus CI Pipeline

on:
  push:
    branches:
      - applications/directus

jobs:
  checkout:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

  setup-node:
    runs-on: self-hosted
    needs: checkout
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

  install-pnpm:
    runs-on: self-hosted
    needs: setup-node
    steps:
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

  install-dependencies:
    runs-on: self-hosted
    needs: install-pnpm
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    runs-on: self-hosted
    needs: install-dependencies
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Lint
        run: pnpm lint

  build:
    runs-on: self-hosted
    needs: lint
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Build
        run: pnpm build

  test:
    runs-on: self-hosted
    needs: build
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Run tests
        run: pnpm --recursive --filter '!tests-blackbox' --filter '!tests-e2e' --filter '!e2e' --filter '!app' test