# Pipeline stages
stages:
  - checkout
  - generate-env
  - verify-dependencies
  - start-services
  - install-dependencies
  - build-app
  - reset-database
  - run-migrations
  - verify-build
  - start-outline


# Global variables
variables:
  DOCKER_COMPOSE_FILE: "microservices/docker-compose-microservices.yml"
  MICROSERVICES: "db api-interface job-postings job-reviews data-access"
  OUTLINE_DIR: "outline"

# Cache node_modules across jobs
cache:
  key: outline-${CI_COMMIT_REF_SLUG}
  paths:
    - outline/node_modules/
    - outline/.yarn/

# Use your local runner with the tags you set
default:
  tags:
    - linux
    - docker
    
# Before each job
before_script:
  - echo "Starting CI/CD pipeline for commit $CI_COMMIT_SHORT_SHA"
  - echo "Working directory $(pwd)"
  - ls -la


# ==========================================
# Outline Build Pipeline (applications/outline branch)
# 10 stages matching Azure DevOps pipeline
# ==========================================

# Step 1: Checkout code
checkout-outline:
  stage: checkout
  before_script:
    - Write-Host "Starting Outline build pipeline for commit $env:CI_COMMIT_SHORT_SHA"
  script:
    - Write-Host "=== Checkout code ==="
    - '& cmd /c "git submodule update --init --recursive 2>&1"'
    - Write-Host "Repository checked out"
  only:
    - applications/outline

# Step 2: Generate .env file
generate-env-outline:
  stage: generate-env
  before_script: []
  script:
    - cd outline
    - |
      Write-Host "=== Generating .env file ==="
      $SECRET_KEY = -join ((1..32) | ForEach-Object { "{0:x2}" -f (Get-Random -Minimum 0 -Maximum 256) })
      $UTILS_SECRET = -join ((1..32) | ForEach-Object { "{0:x2}" -f (Get-Random -Minimum 0 -Maximum 256) })
      @"
      NODE_ENV=development
      URL=http://localhost:3000
      PORT=3000
      WEB_CONCURRENCY=1
      DEFAULT_LANGUAGE=en_US
      DATABASE_URL=postgres://outline_user:outline_pass@127.0.0.1:5432/outline
      PGSSLMODE=disable
      REDIS_URL=redis://127.0.0.1:6379
      FILE_STORAGE=local
      FILE_STORAGE_LOCAL_ROOT_DIR=D:\tools\outline-data
      FILE_STORAGE_UPLOAD_MAX_SIZE=262144000
      FORCE_HTTPS=false
      RATE_LIMITER_ENABLED=false
      ENABLE_UPDATES=false
      DEBUG=http
      LOG_LEVEL=debug
      SMTP_FROM_EMAIL=hello@example.com
      SECRET_KEY=$SECRET_KEY
      UTILS_SECRET=$UTILS_SECRET
      DEVELOPMENT_UNSAFE_INLINE_CSP=true
      "@ | Set-Content -Path .env -Encoding UTF8
      Write-Host ".env file created"
  only:
    - applications/outline

# Step 3: Verify dependencies
verify-dependencies-outline:
  stage: verify-dependencies
  before_script: []
  script:
    - Write-Host "=== Verifying system dependencies ==="
    - '& cmd /c "node --version 2>&1"'
    - '& cmd /c "yarn --version 2>&1"'
    - '& cmd /c "D:\tools\pgsql\bin\pg_isready.exe 2>nul && echo PG_OK || echo PG_FAIL"'
    - '& cmd /c "D:\tools\redis\redis-cli.exe ping 2>nul && echo REDIS_OK || echo REDIS_FAIL"'
  only:
    - applications/outline

# Step 4: Start services
start-services-outline:
  stage: start-services
  before_script: []
  script:
    - |
      Write-Host "=== Starting PostgreSQL ==="
      $pgReady = & cmd /c "D:\tools\pgsql\bin\pg_isready.exe 2>nul"
      if ($LASTEXITCODE -ne 0) {
        & cmd /c "D:\tools\pgsql\bin\pg_ctl.exe start -D D:\tools\pgsql\data -l D:\tools\pgsql\log.txt"
      } else {
        Write-Host "PostgreSQL is already running"
      }
    - |
      Write-Host "=== Starting Redis ==="
      $redisPing = & cmd /c "D:\tools\redis\redis-cli.exe ping 2>nul"
      if ($redisPing -ne "PONG") {
        Start-Process -FilePath "D:\tools\redis\redis-server.exe" -ArgumentList "D:\tools\redis\redis.windows.conf" -WindowStyle Hidden -RedirectStandardOutput "D:\tools\redis\redis.log" -RedirectStandardError "D:\tools\redis\redis-err.log"
      } else {
        Write-Host "Redis is already running"
      }
    - |
      Start-Sleep -Seconds 3
      Write-Host "=== Verifying services ==="
      & cmd /c "D:\tools\pgsql\bin\pg_isready.exe 2>&1"
      if ($LASTEXITCODE -ne 0) { Write-Host "PostgreSQL: FAILED"; exit 1 } else { Write-Host "PostgreSQL: OK" }
      $redisPing = & cmd /c "D:\tools\redis\redis-cli.exe ping 2>nul"
      if ($redisPing -ne "PONG") { Write-Host "Redis: FAILED"; exit 1 } else { Write-Host "Redis: OK" }
  only:
    - applications/outline

# Step 5: Install dependencies
install-dependencies-outline:
  stage: install-dependencies
  before_script: []
  script:
    - cd outline
    - |
      Write-Host "=== Cleaning previous build ==="
      $env:NODE_ENV = "development"
      & cmd /c "yarn clean 2>&1"
      $true
      if (Test-Path "node_modules\.cache") { Remove-Item -Recurse -Force "node_modules\.cache" }
      Write-Host "=== Installing Node.js dependencies ==="
      & cmd /c "yarn install --immutable 2>&1"
      if ($LASTEXITCODE -ne 0) { Write-Host "yarn install failed"; exit 1 }
  only:
    - applications/outline

# Step 6: Build Outline
build-outline:
  stage: build-app
  before_script: []
  script:
    - cd outline
    - |
      Write-Host "=== Building Outline ==="
      $env:NODE_ENV = "production"
      & cmd /c "yarn build 2>&1"
      if ($LASTEXITCODE -ne 0) { Write-Host "yarn build failed"; exit 1 }
  only:
    - applications/outline

# Step 7: Reset database
reset-database-outline:
  stage: reset-database
  before_script: []
  script:
    - cd outline
    - |
      Write-Host "=== Resetting database ==="
      & cmd /c "D:\tools\pgsql\bin\dropdb.exe -U postgres --if-exists outline 2>&1"
      & cmd /c "D:\tools\pgsql\bin\createdb.exe -U postgres -O outline_user outline 2>&1"
      if ($LASTEXITCODE -eq 0) { Write-Host "Database recreated" } else { Write-Host "Database may not have existed" }
  only:
    - applications/outline

# Step 8: Run database migrations
run-migrations-outline:
  stage: run-migrations
  before_script: []
  script:
    - cd outline
    - |
      Write-Host "=== Ensuring services are running ==="
      $pgReady = & cmd /c "D:\tools\pgsql\bin\pg_isready.exe 2>&1"
      if ($LASTEXITCODE -ne 0) {
        $pgStatus = & cmd /c "D:\tools\pgsql\bin\pg_ctl.exe status -D D:\tools\pgsql\data 2>&1"
        if ($pgStatus -match "running") {
          Start-Process -FilePath "D:\tools\pgsql\bin\pg_ctl.exe" -ArgumentList "restart","-D","D:\tools\pgsql\data","-l","D:\tools\pgsql\log.txt" -WindowStyle Hidden -Wait
        } else {
          Start-Process -FilePath "D:\tools\pgsql\bin\pg_ctl.exe" -ArgumentList "start","-D","D:\tools\pgsql\data","-l","D:\tools\pgsql\log.txt" -WindowStyle Hidden -Wait
        }
        $retries = 0
        while ($retries -lt 10) {
          Start-Sleep -Seconds 2
          & cmd /c "D:\tools\pgsql\bin\pg_isready.exe 2>nul" | Out-Null
          if ($LASTEXITCODE -eq 0) { break }
          $retries++
        }
        if ($LASTEXITCODE -ne 0) { Write-Host "PostgreSQL failed to start"; exit 1 }
      }
      Write-Host "PostgreSQL: OK"
      $redisPing = & cmd /c "D:\tools\redis\redis-cli.exe ping 2>nul"
      if ($redisPing -ne "PONG") {
        Write-Host "Redis not running, starting..."
        Start-Process -FilePath "D:\tools\redis\redis-server.exe" -ArgumentList "D:\tools\redis\redis.windows.conf" -WindowStyle Hidden -RedirectStandardOutput "D:\tools\redis\redis.log" -RedirectStandardError "D:\tools\redis\redis-err.log"
        Start-Sleep -Seconds 3
      }
    - |
      Write-Host "=== Running database migrations ==="
      $prevEAP = $ErrorActionPreference
      $ErrorActionPreference = 'SilentlyContinue'
      & cmd /c "yarn db:create --env=production-ssl-disabled 2>&1"
      $ErrorActionPreference = $prevEAP
      Write-Host "Database create step done (may already exist)"
      $env:NODE_ENV = "development"
      Start-Process -FilePath "node" -ArgumentList "build\server\index.js" -WindowStyle Hidden -RedirectStandardOutput "D:\tools\outline-migrations.log" -RedirectStandardError "D:\tools\outline-migrations-err.log"
      Write-Host "Waiting for server to start and run migrations..."
      Start-Sleep -Seconds 15
      Write-Host "=== Migration log output ==="
      if (Test-Path "D:\tools\outline-migrations.log") { Get-Content "D:\tools\outline-migrations.log" -Tail 30 }
      & cmd /c "taskkill /f /im node.exe 2>nul"
      Write-Host "Migrations complete"
  only:
    - applications/outline

# Step 9: Verify build
verify-build-outline:
  stage: verify-build
  before_script: []
  script:
    - cd outline
    - |
      Write-Host "=== Verifying build ==="
      if (Test-Path "build\server\index.js") { Write-Host "Server build OK" } else { Write-Host "Server build missing"; exit 1 }
      if (Test-Path "build\app" -PathType Container) { Write-Host "Client build OK" } else { Write-Host "Client build missing"; exit 1 }
      Write-Host "Outline build completed successfully!"
  only:
    - applications/outline

# Step 10: Start Outline
start-outline:
  stage: start-outline
  before_script: []
  script:
    - cd outline
    - |
      Write-Host "=== Ensuring services are running ==="
      $pgReady = & cmd /c "D:\tools\pgsql\bin\pg_isready.exe 2>&1"
      if ($LASTEXITCODE -ne 0) {
        $pgStatus = & cmd /c "D:\tools\pgsql\bin\pg_ctl.exe status -D D:\tools\pgsql\data 2>&1"
        if ($pgStatus -match "running") {
          Start-Process -FilePath "D:\tools\pgsql\bin\pg_ctl.exe" -ArgumentList "restart","-D","D:\tools\pgsql\data","-l","D:\tools\pgsql\log.txt" -WindowStyle Hidden -Wait
        } else {
          Start-Process -FilePath "D:\tools\pgsql\bin\pg_ctl.exe" -ArgumentList "start","-D","D:\tools\pgsql\data","-l","D:\tools\pgsql\log.txt" -WindowStyle Hidden -Wait
        }
        $retries = 0
        while ($retries -lt 10) {
          Start-Sleep -Seconds 2
          & cmd /c "D:\tools\pgsql\bin\pg_isready.exe 2>nul" | Out-Null
          if ($LASTEXITCODE -eq 0) { break }
          $retries++
        }
        if ($LASTEXITCODE -ne 0) { Write-Host "PostgreSQL failed to start"; exit 1 }
      }
      Write-Host "PostgreSQL: OK"
      $redisPing = & cmd /c "D:\tools\redis\redis-cli.exe ping 2>nul"
      if ($redisPing -ne "PONG") {
        Write-Host "Redis not running, starting..."
        Start-Process -FilePath "D:\tools\redis\redis-server.exe" -ArgumentList "D:\tools\redis\redis.windows.conf" -WindowStyle Hidden -RedirectStandardOutput "D:\tools\redis\redis.log" -RedirectStandardError "D:\tools\redis\redis-err.log"
        Start-Sleep -Seconds 3
      }
    - |
      Write-Host "=== Starting Outline ==="
      $env:NODE_ENV = "development"
      Start-Process -FilePath "node" -ArgumentList "build\server\index.js" -WindowStyle Hidden -RedirectStandardOutput "D:\tools\outline-server.log" -RedirectStandardError "D:\tools\outline-server-err.log"
      Write-Host "Waiting for server to be ready..."
      Start-Sleep -Seconds 10
      try {
        $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -MaximumRedirection 0 -ErrorAction SilentlyContinue
        if ($response.StatusCode -eq 200 -or $response.StatusCode -eq 302) {
          Write-Host "Outline is running at http://localhost:3000"
        } else {
          Write-Host "Server started but may still be initializing"
        }
      } catch {
        if ($_.Exception.Response.StatusCode.value__ -eq 302) {
          Write-Host "Outline is running at http://localhost:3000"
        } else {
          Write-Host "Server started but may still be initializing"
        }
      }
  only:
    - applications/outline