trigger:
  branches:
    include:
      - applications/directus

pool:
  name: TeseMestradoPool

jobs:
  - job: Checkout
    displayName: 'Checkout repository'
    steps:
      - checkout: self
        submodules: true
        displayName: 'Checkout repository'

  - job: SetupNode
    displayName: 'Setup Node.js'
    dependsOn: Checkout
    steps:
      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Setup Node.js'

  - job: InstallPnpm
    displayName: 'Install pnpm'
    dependsOn: SetupNode
    steps:
      - script: |
          npm install -g pnpm@10 --force
        displayName: 'Install pnpm'

  - job: InstallDependencies
    displayName: 'Install dependencies'
    dependsOn: InstallPnpm
    steps:
      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Setup Node.js'
      - script: |
          cd directus && pnpm install --frozen-lockfile
        displayName: 'Install dependencies'

  - job: Lint
    displayName: 'Lint'
    dependsOn: InstallDependencies
    steps:
      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Setup Node.js'
      - script: |
          cd directus && pnpm lint
        displayName: 'Lint'

  - job: Build
    displayName: 'Build'
    dependsOn: Lint
    steps:
      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Setup Node.js'
      - script: |
          cd directus && pnpm build
        displayName: 'Build'
