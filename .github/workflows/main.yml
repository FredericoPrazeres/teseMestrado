name: Akaunting CI/CD Pipeline

on:
  push:
    branches:
      - applications/akaunting
  pull_request:
    branches:
      - applications/akaunting

jobs:
  setup-and-validate:
    name: Setup and Validate
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Verify akaunting directory
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          if [ ! -d "./akaunting" ]; then
            echo "Error: akaunting directory not found!"
            echo "Available directories:"
            find . -maxdepth 2 -type d
            exit 1
          fi
          echo "Akaunting directory found, contents:"
          ls -la ./akaunting
          if [ -f "./akaunting/composer.json" ]; then
            echo "✓ composer.json found"
          else
            echo "✗ composer.json not found - this will be needed for dependency installation"
          fi

      - name: Check PHP version
        run: |
          php -v
          php -m

  install-dependencies:
    name: Install Dependencies
    runs-on: self-hosted
    needs: setup-and-validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Laravel environment
        working-directory: ./akaunting
        run: |
          # Copy .env.example to .env before composer install
          cp .env.example .env
          # Set database to SQLite to avoid MySQL connection during install
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          # Use absolute path for SQLite database
          DB_PATH="$(pwd)/database/database.sqlite"
          sed -i "s|DB_DATABASE=akaunting|DB_DATABASE=${DB_PATH}|" .env
          # Create SQLite database file with proper permissions
          mkdir -p database
          touch database/database.sqlite
          chmod 664 database/database.sqlite
          chmod 775 database

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: akaunting/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('akaunting/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: ./akaunting
        run: |
          composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader --no-scripts

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: akaunting/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('akaunting/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NPM dependencies
        working-directory: ./akaunting
        run: |
          npm ci

      - name: Build frontend assets
        working-directory: ./akaunting
        run: |
          npm run production

  code-quality:
    name: Code Quality Checks
    runs-on: self-hosted
    needs: install-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Laravel environment
        working-directory: ./akaunting
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=akaunting/DB_DATABASE=:memory:/' .env
          mkdir -p database
          chmod 775 database

      - name: Restore Composer dependencies
        uses: actions/cache@v3
        with:
          path: akaunting/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('akaunting/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies if cache miss
        working-directory: ./akaunting
        run: |
          if [ ! -d "vendor" ]; then
            composer install --prefer-dist --no-progress --no-interaction --no-scripts
          fi

      - name: Check code style (PSR-12)
        working-directory: ./akaunting
        run: |
          echo "Checking code style..."
          # Add your code style checker here (e.g., PHP_CodeSniffer, PHP-CS-Fixer)
          # ./vendor/bin/phpcs --standard=PSR12 app/

      - name: Run static analysis
        working-directory: ./akaunting
        run: |
          echo "Running static analysis..."
          # Add your static analysis tool here (e.g., PHPStan, Psalm)
          # ./vendor/bin/phpstan analyse

  test:
    name: Run Tests
    runs-on: self-hosted
    needs: install-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Laravel environment
        working-directory: ./akaunting
        run: |
          cp .env.example .env
          # For tests, we use :memory: which doesn't need a file
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=akaunting/DB_DATABASE=:memory:/' .env
          # Still create database directory for any file-based operations
          mkdir -p database
          chmod 775 database

      - name: Restore Composer dependencies
        uses: actions/cache@v3
        with:
          path: akaunting/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('akaunting/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies if cache miss
        working-directory: ./akaunting
        run: |
          if [ ! -d "vendor" ]; then
            composer install --prefer-dist --no-progress --no-interaction --no-scripts
          fi

      - name: Generate application key
        working-directory: ./akaunting
        run: |
          php artisan key:generate --ansi

      - name: Create reports directory
        working-directory: ./akaunting
        run: |
          mkdir -p reports

      - name: Run Unit Tests
        working-directory: ./akaunting
        run: |
          ./vendor/bin/phpunit --testsuite=Unit --log-junit reports/unit-tests.xml || true

      - name: Run Feature Tests
        working-directory: ./akaunting
        run: |
          ./vendor/bin/phpunit --testsuite=Feature --log-junit reports/feature-tests.xml || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: akaunting/reports/

  security-scan:
    name: Security Scan
    runs-on: self-hosted
    needs: install-dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Laravel environment
        working-directory: ./akaunting
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=akaunting/DB_DATABASE=:memory:/' .env
          mkdir -p database
          chmod 775 database

      - name: Restore Composer dependencies
        uses: actions/cache@v3
        with:
          path: akaunting/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('akaunting/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies if cache miss
        working-directory: ./akaunting
        run: |
          if [ ! -d "vendor" ]; then
            composer install --prefer-dist --no-progress --no-interaction --no-scripts
          fi

      - name: Check for security vulnerabilities
        working-directory: ./akaunting
        run: |
          composer audit

  build-report:
    name: Build Report
    runs-on: self-hosted
    needs: [code-quality, test, security-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Generate build report
        run: |
          echo "Build completed at $(date)"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Pipeline status: ${{ job.status }}"

      - name: Notify completion
        run: |
          echo "CI/CD Pipeline completed successfully!"