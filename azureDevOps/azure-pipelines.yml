trigger:
  branches:
    include:
      - applications/directus

pool:
  name: TeseMestradoPool

jobs:
  - job: Build
    displayName: 'Directus CI Pipeline'
    steps:
      - checkout: self
        clean: false
        submodules: true
        displayName: 'Checkout repository'

      - script: |
          cd directus && rm -rf node_modules
        displayName: 'Clean dependencies'

      - script: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 22
          pnpm install --frozen-lockfile
        displayName: 'Install dependencies'

      - script: |
          pnpm lint
        displayName: 'Lint'

      - script: |
          pnpm build
        displayName: 'Build'
