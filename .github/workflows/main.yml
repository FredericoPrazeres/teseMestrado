name: Directus CI Pipeline

on:
  push:
    branches:
      - applications/direc

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name : clean dependencies
        run: |
          rm -rf node_modules

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build