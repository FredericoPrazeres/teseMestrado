name: Directus CI Pipeline

on:
  push:
    branches:
      - applications/directus

jobs:

  checkout:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

  clean:
    runs-on: self-hosted
    needs: checkout
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Clean dependencies
        run: rm -rf node_modules

  install:
    runs-on: self-hosted
    needs: clean
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Install dependencies
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm use 22
          echo "$(dirname $(which node))" >> $GITHUB_PATH
          pnpm install --frozen-lockfile

  lint:
    runs-on: self-hosted
    needs: install
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Lint
        run: pnpm lint

  build:
    runs-on: self-hosted
    needs: lint
    defaults:
      run:
        working-directory: directus
    steps:
      - name: Build
        run: pnpm build