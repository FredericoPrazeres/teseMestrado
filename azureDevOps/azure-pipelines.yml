name: "Cal.diy — Job Overhead Benchmark"

trigger:
  branches:
    include:
      - applications/calcom

variables:
  DATABASE_URL: "postgresql://postgres@localhost:5450/cal-saml"
  DATABASE_DIRECT_URL: "postgresql://postgres@localhost:5450/cal-saml"

pool:
  name: TeseMestradoPool

jobs:
  - job: job_01_cleanup
    displayName: "Job 01 — Cleanup Previous Runs"
    steps:
      - checkout: none
      - bash: |
          set +e
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          docker rmi $(docker images -q) 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          exit 0
        displayName: "Cleanup Previous Runs"

  - job: job_02_checkout
    displayName: "Job 02 — Checkout"
    dependsOn: job_01_cleanup
    steps:
      - checkout: self
        submodules: true
        displayName: "Checkout"

  - job: job_03_node_version
    displayName: "Job 03 — Node Version"
    dependsOn: job_02_checkout
    steps:
      - checkout: none
      - bash: |
          node -v
          npm -v
          yarn -v
        displayName: "Show Node.js, npm, and yarn versions"

  - job: job_04_corepack
    displayName: "Job 04 — Corepack Enable"
    dependsOn: job_03_node_version
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          corepack enable
          corepack install
        displayName: "Enable Corepack"

  - job: job_05_install
    displayName: "Job 05 — Yarn Install"
    dependsOn: job_04_corepack
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          yarn install
        displayName: "Install dependencies"

  - job: job_06_env_setup
    displayName: "Job 06 — Environment Setup"
    dependsOn: job_05_install
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          cp .env.example .env
          NEXTAUTH_SECRET=$(openssl rand -base64 32)
          CALENDSO_ENCRYPTION_KEY=$(openssl rand -base64 24)
          sed -i '' "s|NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=$NEXTAUTH_SECRET|" .env 2>/dev/null || \
            sed -i "s|NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=$NEXTAUTH_SECRET|" .env
          sed -i '' "s|CALENDSO_ENCRYPTION_KEY=.*|CALENDSO_ENCRYPTION_KEY=$CALENDSO_ENCRYPTION_KEY|" .env 2>/dev/null || \
            sed -i "s|CALENDSO_ENCRYPTION_KEY=.*|CALENDSO_ENCRYPTION_KEY=$CALENDSO_ENCRYPTION_KEY|" .env
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "DATABASE_DIRECT_URL=$DATABASE_DIRECT_URL" >> .env
        displayName: "Generate environment file"
        env:
          DATABASE_URL: $(DATABASE_URL)
          DATABASE_DIRECT_URL: $(DATABASE_DIRECT_URL)

  - job: job_07_lint
    displayName: "Job 07 — Lint"
    dependsOn: job_06_env_setup
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          yarn lint
        displayName: "Lint"

  - job: job_08_type_check
    displayName: "Job 08 — Type Check"
    dependsOn: job_07_lint
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          NODE_OPTIONS="--max-old-space-size=8192" yarn type-check
        displayName: "Type Check"
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

  - job: job_09_test
    displayName: "Job 09 — Unit Tests"
    dependsOn: job_08_type_check
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          TZ=UTC LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 LANGUAGE=en_US yarn test --dangerouslyIgnoreUnhandledErrors --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000
        displayName: "Unit Tests"

  - job: job_10_prisma_validate
    displayName: "Job 10 — Prisma Validate"
    dependsOn: job_09_test
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          yarn workspace @calcom/prisma prisma validate
        displayName: "Prisma Validate"

  - job: job_11_db_start
    displayName: "Job 11 — Start Database"
    dependsOn: job_10_prisma_validate
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          docker compose -f packages/prisma/docker-compose.yml up -d
          sleep 5
        displayName: "Start Database"

  - job: job_12_build
    displayName: "Job 12 — Build"
    dependsOn: job_11_db_start
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          NODE_OPTIONS="--max-old-space-size=12288" yarn build
        displayName: "Build"
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"

  - job: job_13_db_stop
    displayName: "Job 13 — Stop Database"
    dependsOn: job_12_build
    condition: always()
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          docker compose -f packages/prisma/docker-compose.yml down || true
        displayName: "Stop Database"

  - job: job_14_docker_build
    displayName: "Job 14 — Docker Build"
    dependsOn: job_13_db_stop
    steps:
      - checkout: none
      - bash: |
          cd cal.diy
          docker build -t cal-diy:bench -f Dockerfile . && docker rmi cal-diy:bench || true
        displayName: "Docker Build"
