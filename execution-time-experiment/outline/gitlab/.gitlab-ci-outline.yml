# Outline Build Pipeline - GitLab CI
stages:
  - verify
  - install
  - clean
  - build
  - migrate
  - status

variables:
  OUTLINE_DIR: "outline"

default:
  tags:
    - docker
    - linux

before_script:
  - echo "Starting Outline build pipeline for commit $CI_COMMIT_SHORT_SHA"
  - cd $OUTLINE_DIR

# Stage 1: Verify system dependencies
verify-dependencies:
  stage: verify
  script:
    - echo "=== Verifying system dependencies ==="
    - node --version
    - yarn --version
    - pg_isready || echo "WARNING - PostgreSQL is not running"
    - redis-cli ping || echo "WARNING - Redis is not running"
  only:
    - applications/outline

# Stage 2: Start services and install dependencies
start-services:
  stage: install
  script:
    - echo "=== Starting PostgreSQL and Redis ==="
    - brew services start postgresql@17 || sudo systemctl start postgresql || true
    - brew services start redis || sudo systemctl start redis || true
    - sleep 3
    - pg_isready
    - redis-cli ping
  only:
    - applications/outline

install-dependencies:
  stage: install
  script:
    - echo "=== Installing Node.js dependencies ==="
    - NODE_ENV=development yarn install --immutable
  only:
    - applications/outline

# Stage 3: Clean previous build
clean-build:
  stage: clean
  script:
    - echo "=== Cleaning previous build ==="
    - yarn clean || true
    - rm -rf node_modules/.cache
  only:
    - applications/outline

# Stage 4: Build Outline
build-outline:
  stage: build
  script:
    - echo "=== Building Outline ==="
    - NODE_ENV=production yarn build
    - echo "Verifying build output..."
    - test -f build/server/index.js && echo "✅ Server build OK" || exit 1
    - test -d build/app && echo "✅ Client build OK" || exit 1
  only:
    - applications/outline

# Stage 5: Run database migrations
run-migrations:
  stage: migrate
  script:
    - echo "=== Running database migrations ==="
    - yarn db:create --env=production-ssl-disabled || echo "Database already exists"
    - |
      node build/server/index.js &
      SERVER_PID=$!
      echo "Waiting for server to start and run migrations..."
      sleep 15
      kill $SERVER_PID 2>/dev/null || true
      echo "Migrations complete"
  only:
    - applications/outline

# Stage 6: Show status
show-status:
  stage: status
  script:
    - echo "=== BUILD COMPLETE ==="
    - echo "Build output:"
    - ls -la build/server/index.js
    - ls -la build/app/
    - echo "🎉 Outline build completed successfully!"
    - echo "=== Starting Outline ==="
    - yarn start &
    - SERVER_PID=$!
    - echo "Outline started with PID $SERVER_PID"
    - sleep 10
    - curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200\|302" && echo "✅ Outline is running at http://localhost:3000" || echo "⚠️ Server started but may still be initializing"
  only:
    - applications/outline
