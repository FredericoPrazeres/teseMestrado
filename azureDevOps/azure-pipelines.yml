trigger:
  branches:
    include:
      - applications/tooljet

variables:
  NODE_VERSION: '22.15.1'
  TOOLJET_DIR: 'ToolJet'

pool:
  name: TeseMestradoPool

stages:
  - stage: CI
    displayName: ToolJet CI/CD Pipeline
    jobs:
      - job: checkout
        displayName: Checkout & Environment Info
        steps:
          - task: UseNode@1
            inputs:
              version: '$(NODE_VERSION)'
            displayName: Set up Node.js

          - checkout: self
            submodules: false
            displayName: Checkout repository

          - bash: |
              git submodule update --init --depth=1 ToolJet
            displayName: Initialize ToolJet submodule (non-recursive)

          - bash: |
              echo "Node version required: $(NODE_VERSION)"
              node --version || true
              npm --version || true
              docker --version || true
              git --version
              git submodule status --recursive
            displayName: Verify runtime prerequisites

          - bash: |
              echo "If ToolJet needs benchmarking patches, make them in a fork and point the submodule URL to that fork before running the runners."
            displayName: Note on ToolJet fork usage

      - job: cleanup
        displayName: Cleanup previous deployment
        dependsOn: checkout
        steps:
          - task: UseNode@1
            inputs:
              version: '$(NODE_VERSION)'
            displayName: Set up Node.js

          - bash: |
              docker stop tooljet 2>/dev/null || true
              docker rm tooljet 2>/dev/null || true
              docker image prune -f
              docker volume prune -f
              docker network prune -f
            displayName: Stop containers and prune Docker resources

      - job: install_dependencies
        displayName: Install dependencies
        dependsOn: cleanup
        steps:
          - task: UseNode@1
            inputs:
              version: '$(NODE_VERSION)'
            displayName: Set up Node.js

          - bash: |
              cd "$(TOOLJET_DIR)"
              npm --prefix plugins install
              npm --prefix server install --production=false
              npm --prefix frontend install --production=false
            displayName: Install all npm dependencies

      - job: lint
        displayName: Lint & Code Quality
        dependsOn: install_dependencies
        steps:
          - task: UseNode@1
            inputs:
              version: '$(NODE_VERSION)'
            displayName: Set up Node.js

          - bash: |
              cd "$(TOOLJET_DIR)"
              npm --prefix server run lint -- --max-warnings=0 || echo "Server lint completed with warnings"
              npm --prefix frontend run lint -- --max-warnings=0 || echo "Frontend lint completed with warnings"
            displayName: Lint server and frontend code

      - job: build
        displayName: Build application
        dependsOn: lint
        steps:
          - task: UseNode@1
            inputs:
              version: '$(NODE_VERSION)'
            displayName: Set up Node.js

          - bash: |
              cd "$(TOOLJET_DIR)"
              export NODE_OPTIONS="--max-old-space-size=8192"
              NODE_ENV=production npm --prefix plugins run build
              NODE_ENV=production npm --prefix frontend run build
              npm install -g @nestjs/cli
              npm --prefix server run build
            displayName: Build plugins, frontend, and server

      - job: test
        displayName: Run tests
        dependsOn: build
        steps:
          - task: UseNode@1
            inputs:
              version: '$(NODE_VERSION)'
            displayName: Set up Node.js

          - bash: |
              cd "$(TOOLJET_DIR)/server"
              NODE_ENV=test npx jest --config jest.config.ts --detectOpenHandles --forceExit --passWithNoTests --testPathIgnorePatterns='test/controllers|test/services|test/modules' || echo "Server tests completed with failures"
              cd ../frontend
              npm install --save-dev jest-environment-jsdom || true
              npx jest --passWithNoTests --forceExit || echo "Frontend tests completed with failures"
            displayName: Run server and frontend unit tests
