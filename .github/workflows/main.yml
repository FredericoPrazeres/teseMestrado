name: Microservices CI/CD Pipeline

on:
  push:
    branches:
      - waitTest

jobs:
  job1:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run
        run: echo "Job 1 — waiting..." && sleep 3

  job2:
    runs-on: self-hosted
    needs: job1
    steps:
      - name: Run
        run: echo "Job 2 — waiting..." && sleep 3

  job3:
    runs-on: self-hosted
    needs: job2
    steps:
      - name: Run
        run: echo "Job 3 — waiting..." && sleep 3

  job4:
    runs-on: self-hosted
    needs: job3
    steps:
      - name: Run
        run: echo "Job 4 — waiting..." && sleep 3

  job5:
    runs-on: self-hosted
    needs: job4
    steps:
      - name: Run
        run: echo "Job 5 — waiting..." && sleep 3

  job6:
    runs-on: self-hosted
    needs: job5
    steps:
      - name: Run
        run: echo "Job 6 — waiting..." && sleep 3

  job7:
    runs-on: self-hosted
    needs: job6
    steps:
      - name: Run
        run: echo "Job 7 — waiting..." && sleep 3

  job8:
    runs-on: self-hosted
    needs: job7
    steps:
      - name: Run
        run: echo "Job 8 — waiting..." && sleep 3

  job9:
    runs-on: self-hosted
    needs: job8
    steps:
      - name: Run
        run: echo "Job 9 — waiting..." && sleep 3

  job10:
    runs-on: self-hosted
    needs: job9
    steps:
      - name: Run
        run: echo "Job 10 — done!" && sleep 3

