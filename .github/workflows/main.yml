name: "Cal.diy — Step Overhead Benchmark"

on:
  push:
    branches:
      - applications/calcom

env:
  DATABASE_URL: "postgresql://postgres@localhost:5450/cal-saml"
  DATABASE_DIRECT_URL: "postgresql://postgres@localhost:5450/cal-saml"

jobs:
  all-steps:
    name: "All Steps in One Job"
    runs-on: self-hosted
    defaults:
      run:
        # Runner discovers Git Bash automatically on Windows when `shell: bash` is used.
        shell: bash
        working-directory: cal.diy
    steps:
      - name: "Step 01 — Cleanup Previous Runs"
        working-directory: .
        run: |
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          docker rmi $(docker images -q) 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true

      - name: "Step 02 — Checkout"
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: "Step 03 — Node Setup"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Step 04 — Corepack Enable"
        run: corepack enable && corepack install

      - name: "Step 05 — Yarn Install"
        run: yarn install

      - name: "Step 06 — Environment Setup"
        run: |
          cp .env.example .env
          NEXTAUTH_SECRET=$(openssl rand -base64 32)
          CALENDSO_ENCRYPTION_KEY=$(openssl rand -base64 24)
          sed -i '' "s|NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=$NEXTAUTH_SECRET|" .env 2>/dev/null || \
            sed -i "s|NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=$NEXTAUTH_SECRET|" .env
          sed -i '' "s|CALENDSO_ENCRYPTION_KEY=.*|CALENDSO_ENCRYPTION_KEY=$CALENDSO_ENCRYPTION_KEY|" .env 2>/dev/null || \
            sed -i "s|CALENDSO_ENCRYPTION_KEY=.*|CALENDSO_ENCRYPTION_KEY=$CALENDSO_ENCRYPTION_KEY|" .env
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "DATABASE_DIRECT_URL=$DATABASE_DIRECT_URL" >> .env

      - name: "Step 07 — Lint"
        run: yarn lint

      - name: "Step 08 — Type Check"
        run: yarn type-check

      - name: "Step 09 — Unit Tests"
        run: yarn test --dangerouslyIgnoreUnhandledErrors --exclude 'packages/lib/OgImages.test.ts' --exclude 'apps/web/app/api/social/og/image/__tests__/route.test.ts'
        env:
          TZ: UTC

      - name: "Step 10 — Prisma Validate"
        run: yarn workspace @calcom/prisma prisma validate

      - name: "Step 11 — Start Database"
        run: docker compose -f packages/prisma/docker-compose.yml up -d && sleep 5

      - name: "Step 12 — Build"
        run: yarn build

      - name: "Step 13 — Stop Database"
        if: always()
        run: docker compose -f packages/prisma/docker-compose.yml down || true

      - name: "Step 14 — Docker Build"
        run: docker build -t cal-diy:bench -f Dockerfile . && docker rmi cal-diy:bench || true