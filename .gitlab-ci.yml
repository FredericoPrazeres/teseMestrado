# Pipeline stages
stages:
  - checkout
  - stop-services
  - cleanup
  - deploy
  - test
  - status
  - build


# Global variables
variables:
  DOCKER_COMPOSE_FILE: "microservices/docker-compose-microservices.yml"
  MICROSERVICES: "db api-interface job-postings job-reviews data-access"
  OUTLINE_DIR: "outline"

# Use your local runner with the tags you set
default:
  tags:
    - docker
    - linux
    
# Before each job
before_script:
  - echo "Starting CI/CD pipeline for commit $CI_COMMIT_SHORT_SHA"
  - echo "Working directory $(pwd)"
  - ls -la

# Job 1: Show checkout information
checkout-info:
  stage: checkout
  script:
    - echo "=== CHECKOUT STAGE ==="
    - echo "Building commit $CI_COMMIT_SHORT_SHA"
    - echo "Branch $CI_COMMIT_REF_NAME"
    - echo "Working directory $(pwd)"
    - echo "Repository contents:"
    - ls -la
  only:
    - main
    - develop
    - master

# Job 2: Stop current microservices
stop-microservices:
  stage: stop-services
  script:
    - echo "=== STOPPING CURRENT MICROSERVICES ==="
    - |
      for service in $MICROSERVICES; do
        echo "Stopping $service..."
        docker-compose -f $DOCKER_COMPOSE_FILE stop $service || true
      done
  only:
    - main
    - develop
    - master

# Job 3: Remove containers and cleanup
remove-containers:
  stage: cleanup
  script:
    - echo "=== REMOVING MICROSERVICES CONTAINERS ==="
    - |
      for service in $MICROSERVICES; do
        echo "Removing $service container..."
        docker-compose -f $DOCKER_COMPOSE_FILE rm -f $service || true
      done
    - echo "Cleaning unused Docker images..."
    - docker image prune -f || true
  only:
    - main
    - develop
    - master

# Job 4: Deploy services
deploy-services:
  stage: deploy
  script:
    - echo "=== BUILDING AND DEPLOYING SERVICES ==="
    - docker-compose -f $DOCKER_COMPOSE_FILE up --build -d
    - |
      if [ $? -eq 0 ]; then
        echo "Services built and started successfully"
        echo "Waiting for services to initialize..."
        sleep 15
      else
        echo "ERROR: Failed to build and start services"
        exit 1
      fi
  only:
    - main
    - develop
    - master

# Job 5: Run unit tests
job_postings_unit_tests:
  stage: test
  script:
    - docker exec job-postings bash -c "pytest test_job_postings.py"

job_reviews_unit_tests:
  stage: test
  script:
    - docker exec job-reviews bash -c "pytest test_job_reviews.py"

api_interface_unit_tests:
  stage: test
  script:
    - docker exec api-interface bash -c "pytest test_api_interface.py"

api_interface_integration_tests:
  stage: test
  script:
    - docker exec api-interface bash -c "pytest test_api_interface_integration.py"

# Job 6: Show deployment status
show-status:
  stage: status
  script:
    - echo "=== DEPLOYMENT COMPLETE ==="
    - cd /workspace
    - docker-compose -f $DOCKER_COMPOSE_FILE ps
    - echo "🎉 Deployment successful!"
    - echo "Services status:"
  only:
    - main
    - develop
    - master

# ==========================================
# Outline Build Pipeline (applications/outline branch)
# ==========================================
build-outline:
  stage: build
  before_script:
    - echo "Starting Outline build pipeline for commit $CI_COMMIT_SHORT_SHA"
    - cd $OUTLINE_DIR
  script:
    # Step 1: Checkout code
    - echo "=== Checkout code ==="
    - echo "Repository checked out at commit $CI_COMMIT_SHORT_SHA on branch $CI_COMMIT_REF_NAME"
    - sleep 1

    # Step 2: Generate .env file
    - echo "=== Generating .env file ==="
    - |
      cat > .env << 'ENVEOF'
      NODE_ENV=development
      URL=http://localhost:3000
      PORT=3000
      WEB_CONCURRENCY=1
      DEFAULT_LANGUAGE=en_US
      DATABASE_URL=postgres://outline_user:outline_pass@127.0.0.1:5432/outline
      PGSSLMODE=disable
      REDIS_URL=redis://127.0.0.1:6379
      FILE_STORAGE=local
      FILE_STORAGE_LOCAL_ROOT_DIR=/tmp/outline-data
      FILE_STORAGE_UPLOAD_MAX_SIZE=262144000
      FORCE_HTTPS=false
      RATE_LIMITER_ENABLED=false
      ENABLE_UPDATES=false
      DEBUG=http
      LOG_LEVEL=debug
      SMTP_FROM_EMAIL=hello@example.com
      ENVEOF
      SECRET_KEY=$(openssl rand -hex 32)
      UTILS_SECRET=$(openssl rand -hex 32)
      echo "SECRET_KEY=$SECRET_KEY" >> .env
      echo "UTILS_SECRET=$UTILS_SECRET" >> .env
      echo "✅ .env file created"

    # Step 3: Verify system dependencies
    - echo "=== Verifying system dependencies ==="
    - node --version
    - yarn --version
    - pg_isready || echo "WARNING - PostgreSQL is not running"
    - redis-cli ping || echo "WARNING - Redis is not running"

    # Step 4: Start services
    - echo "=== Starting PostgreSQL and Redis ==="
    - brew services start postgresql@17 || sudo systemctl start postgresql || true
    - brew services start redis || sudo systemctl start redis || true
    - sleep 3
    - pg_isready
    - redis-cli ping

    # Step 5: Install Node.js dependencies
    - echo "=== Cleaning previous build ==="
    - yarn clean || true
    - rm -rf node_modules/.cache
    - echo "=== Installing dependencies ==="
    - NODE_ENV=development yarn install --immutable

    # Step 6: Build Outline
    - echo "=== Building Outline ==="
    - NODE_ENV=production yarn build

    # Step 7: Reset database
    - echo "=== Resetting database ==="
    - yarn db:reset || echo "Database reset via yarn failed, trying manually..."
    - dropdb --if-exists outline && createdb -O outline_user outline && echo "✅ Database recreated" || echo "Database may not have existed"

    # Step 8: Run database migrations
    - echo "=== Running database migrations ==="
    - yarn db:create --env=production-ssl-disabled || echo "Database already exists"
    - |
      yarn start &
      SERVER_PID=$!
      echo "Waiting for server to start and run migrations..."
      sleep 15
      kill $SERVER_PID 2>/dev/null || true
      echo "Migrations complete"

    # Step 9: Verify build output
    - echo "=== Verifying build ==="
    - test -f build/server/index.js && echo "✅ Server build OK" || (echo "❌ Server build missing" && exit 1)
    - test -d build/app && echo "✅ Client build OK" || (echo "❌ Client build missing" && exit 1)
    - echo "🎉 Outline build completed successfully!"

    # Step 10: Start Outline
    - echo "=== Starting Outline ==="
    - |
      nohup yarn start > /dev/null 2>&1 &
      echo "Outline started"
      echo "Waiting for server to be ready..."
      sleep 10
      curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200\|302" && echo "✅ Outline is running at http://localhost:3000" || echo "⚠️ Server started but may still be initializing"
  only:
    - applications/outline