trigger:
  branches:
    include:
      - applications/tooljet

variables:
  NODE_VERSION: "22.15.1"
  TOOLJET_DIR: "ToolJet"
  CI: "true"
  HUSKY: "0"

pool:
  name: TeseMestradoPool

jobs:
  - job: CheckoutAndEnvironment
    displayName: "Checkout and Environment"
    steps:
      - checkout: self
        submodules: true
        displayName: "Checkout repository"

      - task: NodeTool@0
        inputs:
          versionSpec: "$(NODE_VERSION)"
        displayName: "Set up Node.js"

      - script: |
          node --version
          npm --version
        shell: powershell
        displayName: "Print Node.js and npm versions"

  - job: CleanupPreviousDeployment
    displayName: "Cleanup previous deployment"
    dependsOn: CheckoutAndEnvironment
    steps:
      - script: |
          $containerId = docker ps -aq --filter "name=^tooljet$"
          if ([string]::IsNullOrWhiteSpace($containerId)) {
            Write-Host "Container not found, skipping stop/remove"
          } else {
            docker stop $containerId | Out-Null
            docker rm $containerId | Out-Null
            Write-Host "Container stopped and removed"
          }
          docker image prune -f
          docker volume prune -f
          docker network prune -f
        shell: powershell
        displayName: "Stop containers and prune Docker resources"

  - job: InstallDependencies
    displayName: "Install dependencies"
    dependsOn: CleanupPreviousDeployment
    steps:
      - checkout: self
        submodules: true
        displayName: "Checkout repository"

      - task: NodeTool@0
        inputs:
          versionSpec: "$(NODE_VERSION)"
        displayName: "Set up Node.js"

      - script: |
          $env:CI="true"
          $env:HUSKY="0"
          $env:npm_config_ignore_scripts="true"

          Push-Location "$(TOOLJET_DIR)/plugins"
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          Pop-Location

          Push-Location "$(TOOLJET_DIR)/server"
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          Pop-Location

          Push-Location "$(TOOLJET_DIR)/frontend"
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          Pop-Location
        shell: powershell
        displayName: "Install all npm dependencies"

  - job: LintCode
    displayName: "Lint code"
    dependsOn: InstallDependencies
    steps:
      - checkout: self
        submodules: true
        displayName: "Checkout repository"

      - task: NodeTool@0
        inputs:
          versionSpec: "$(NODE_VERSION)"
        displayName: "Set up Node.js"

      - script: |
          $env:CI="true"
          $env:HUSKY="0"
          $env:npm_config_ignore_scripts="true"

          Push-Location "$(TOOLJET_DIR)/plugins"
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          Pop-Location

          Push-Location "$(TOOLJET_DIR)/server"
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          Pop-Location

          Push-Location "$(TOOLJET_DIR)/frontend"
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          Pop-Location
        shell: powershell
        displayName: "Install all npm dependencies"

      - script: |
          Write-Host "Linting server code..." -ForegroundColor Cyan
          Push-Location "$(TOOLJET_DIR)/server"
          npm run lint
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Server lint passed" -ForegroundColor Green
          } else {
            Write-Host "Server lint completed with warnings" -ForegroundColor Yellow
            $global:LASTEXITCODE = 0
          }
          Pop-Location

          Write-Host "Linting frontend code..." -ForegroundColor Cyan
          Push-Location "$(TOOLJET_DIR)/frontend"
          npm run lint
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Frontend lint passed" -ForegroundColor Green
          } else {
            Write-Host "Frontend lint completed with warnings" -ForegroundColor Yellow
            $global:LASTEXITCODE = 0
          }
          Pop-Location
        shell: powershell
        displayName: "Lint server and frontend code"

  - job: BuildApplication
    displayName: "Build application"
    dependsOn: LintCode
    steps:
      - checkout: self
        submodules: true
        displayName: "Checkout repository"

      - task: NodeTool@0
        inputs:
          versionSpec: "$(NODE_VERSION)"
        displayName: "Set up Node.js"

      - script: |
          $env:CI="true"
          $env:HUSKY="0"
          $env:npm_config_ignore_scripts="true"

          Push-Location "$(TOOLJET_DIR)/plugins"
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          Pop-Location

          Push-Location "$(TOOLJET_DIR)/server"
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          Pop-Location

          Push-Location "$(TOOLJET_DIR)/frontend"
          npm install --include=dev --ignore-scripts --no-audit --no-fund
          Pop-Location
        shell: powershell
        displayName: "Install all npm dependencies"

      - script: |
          $env:NODE_ENV="production"
          $env:NODE_OPTIONS="--max-old-space-size=4096"
          $env:npm_config_scripts_prepend_node_path="true"

          Write-Host "Building plugins..." -ForegroundColor Cyan
          Push-Location "$(TOOLJET_DIR)/plugins"
          $env:PATH = "$pwd\node_modules\.bin;$env:PATH"
          npm run build
          Pop-Location

          Write-Host "Building frontend..." -ForegroundColor Cyan
          $env:NODE_OPTIONS="--max-old-space-size=8096"
          Push-Location "$(TOOLJET_DIR)/frontend"
          $env:PATH = "$pwd\node_modules\.bin;$env:PATH"
          npm run build
          Pop-Location

          Write-Host "Building server..." -ForegroundColor Cyan
          $env:NODE_OPTIONS="--max-old-space-size=4096"
          npm install -g @nestjs/cli
          Push-Location "$(TOOLJET_DIR)/server"
          $env:PATH = "$pwd\node_modules\.bin;$env:PATH"
          npm run build
          Pop-Location
        shell: powershell
        displayName: "Build plugins, frontend, and server"

  - job: SkipTests
    displayName: "Skip tests"
    dependsOn: BuildApplication
    steps:
      - script: |
          Write-Host "Skipping server and frontend tests by request." -ForegroundColor Yellow
        shell: powershell
        displayName: "Skip server and frontend tests"