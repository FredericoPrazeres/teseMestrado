name: Outline Build Pipeline

trigger:
  branches:
    include:
      - applications/outline

pool:
  name: TeseMestradoPool

jobs:
  - job: Checkout
    displayName: Checkout code
    steps:
      - checkout: self
        submodules: true
        displayName: Checkout code with submodules

  - job: GenerateEnv
    displayName: Generate .env file
    dependsOn: Checkout
    steps:
      - checkout: none
      - bash: |
          echo "=== Generating .env file ==="
          cat > .env << 'ENVEOF'
          NODE_ENV=development
          URL=http://localhost:3000
          PORT=3000
          WEB_CONCURRENCY=1
          DEFAULT_LANGUAGE=en_US
          DATABASE_URL=postgres://outline_user:outline_pass@127.0.0.1:5432/outline
          PGSSLMODE=disable
          REDIS_URL=redis://127.0.0.1:6379
          FILE_STORAGE=local
          FILE_STORAGE_LOCAL_ROOT_DIR=/tmp/outline-data
          FILE_STORAGE_UPLOAD_MAX_SIZE=262144000
          FORCE_HTTPS=false
          RATE_LIMITER_ENABLED=false
          ENABLE_UPDATES=false
          DEBUG=http
          LOG_LEVEL=debug
          SMTP_FROM_EMAIL=hello@example.com
          ENVEOF
          SECRET_KEY=$(openssl rand -hex 32)
          UTILS_SECRET=$(openssl rand -hex 32)
          echo "SECRET_KEY=$SECRET_KEY" >> .env
          echo "UTILS_SECRET=$UTILS_SECRET" >> .env
          echo "✅ .env file created"
        workingDirectory: $(Build.SourcesDirectory)/outline
        displayName: Generate .env file

  - job: VerifyDependencies
    displayName: Verify dependencies
    dependsOn: GenerateEnv
    steps:
      - checkout: none
      - bash: |
          echo "=== Verifying system dependencies ==="
          node --version
          yarn --version
          pg_isready || echo "WARNING: PostgreSQL is not running"
          redis-cli ping || echo "WARNING: Redis is not running"
        displayName: Verify dependencies

  - job: StartServices
    displayName: Start services
    dependsOn: VerifyDependencies
    steps:
      - checkout: none
      - bash: |
          echo "=== Starting PostgreSQL and Redis ==="
          sudo systemctl start postgresql redis-server
          sleep 3
          pg_isready
          redis-cli ping
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='outline_user'" | grep -q 1 \
            || sudo -u postgres psql -c "CREATE USER outline_user WITH PASSWORD 'outline_pass';"
          sudo -u postgres psql -c "ALTER USER outline_user CREATEDB;"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='outline'" | grep -q 1 \
            || PGPASSWORD=outline_pass createdb -h 127.0.0.1 -U outline_user outline
        displayName: Start services

  - job: InstallDependencies
    displayName: Install Node.js dependencies
    dependsOn: StartServices
    steps:
      - checkout: none
      - bash: |
          echo "=== Cleaning previous build ==="
          yarn clean || true
          rm -rf node_modules/.cache
          rm -rf node_modules
          echo "=== Installing dependencies ==="
          NODE_ENV=development yarn install --immutable
        workingDirectory: $(Build.SourcesDirectory)/outline
        displayName: Install Node.js dependencies

  - job: BuildOutline
    displayName: Build Outline
    dependsOn: InstallDependencies
    steps:
      - checkout: none
      - bash: |
          echo "=== Building Outline ==="
          NODE_ENV=production yarn build
        workingDirectory: $(Build.SourcesDirectory)/outline
        displayName: Build Outline

  - job: ResetDatabase
    displayName: Reset database
    dependsOn: BuildOutline
    steps:
      - checkout: none
      - bash: |
          echo "=== Resetting database ==="
          yarn db:reset || echo "Database reset via yarn failed, trying manually..."
          PGPASSWORD=outline_pass dropdb -h 127.0.0.1 -U outline_user --if-exists outline && PGPASSWORD=outline_pass createdb -h 127.0.0.1 -U outline_user outline && echo "✅ Database recreated" || echo "Database may not have existed"
        workingDirectory: $(Build.SourcesDirectory)/outline
        displayName: Reset database

  - job: RunMigrations
    displayName: Run database migrations
    dependsOn:
      - BuildOutline
      - ResetDatabase
    steps:
      - checkout: none
      - bash: |
          echo "=== Running database migrations ==="
          yarn db:create --env=production-ssl-disabled || echo "Database already exists"
          yarn start &
          SERVER_PID=$!
          echo "Waiting for server to start and run migrations..."
          sleep 15
          kill $SERVER_PID 2>/dev/null || true
          echo "Migrations complete"
        workingDirectory: $(Build.SourcesDirectory)/outline
        displayName: Run database migrations

  - job: VerifyBuild
    displayName: Verify build output
    dependsOn: RunMigrations
    steps:
      - checkout: none
      - bash: |
          echo "=== Verifying build ==="
          test -f build/server/index.js && echo "✅ Server build OK" || (echo "❌ Server build missing" && exit 1)
          test -d build/app && echo "✅ Client build OK" || (echo "❌ Client build missing" && exit 1)
          echo "🎉 Outline build completed successfully!"
        workingDirectory: $(Build.SourcesDirectory)/outline
        displayName: Verify build output

  - job: StartOutline
    displayName: Start Outline
    dependsOn: VerifyBuild
    steps:
      - checkout: none
      - bash: |
          echo "=== Starting Outline ==="
          yarn start &
          SERVER_PID=$!
          echo "Outline started with PID $SERVER_PID"
          echo "Waiting for server to be ready..."
          sleep 10
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200\|302" && echo "✅ Outline is running at http://localhost:3000" || echo "⚠️ Server started but may still be initializing"
        workingDirectory: $(Build.SourcesDirectory)/outline
        displayName: Start Outline
